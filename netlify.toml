[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_SITE_URL is a public URL that legitimately appears in the repo —
  # in README.md, mobile/eas.json and as the metadataBase fallback in
  # src/app/layout.tsx — so the secret scanner matches it and fails the build
  # unless told otherwise. It is not a credential. If the scanner ever flags
  # BREVO_FROM_EMAIL (also public — it is the From address on every order
  # email), add it to this list too. Anything genuinely secret
  # (SUPABASE_SERVICE_ROLE_KEY, BREVO_API_KEY) must never be added here — if the
  # scanner finds one of those in build output, that is a real leak to fix
  # rather than silence.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL"

  # mobile/ is the Expo app and is not built or served by this site at all.
  # mobile/eas.json carries the three EXPO_PUBLIC_* values an EAS build needs:
  # the Supabase project URL, the anon key and this site's address. All three
  # are public by design — the anon key is guarded by RLS and already ships
  # inside the APK — but each duplicates a NEXT_PUBLIC_* value, so the scanner
  # counts them as exposed secrets and fails the web build.
  SECRETS_SCAN_OMIT_PATHS = "mobile/**"

# Secrets (SUPABASE_SERVICE_ROLE_KEY, BREVO_API_KEY, ...) belong in the
# Netlify UI with "Contains secret" enabled, never in this file.
